<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>form-multi-switch via esm.sh</title>
		<link rel="stylesheet" href="./styles.css" />
		<style>
			/* Demo-specific styles */
		</style>
	</head>
	<body>
		<h1>esm.sh CDN sanity check</h1>
		<p>
			This page loads the component class from <code>esm.sh</code> and
			registers it manually.
		</p>

		<form-multi-switch>
			<p>Replace this markup once you customize form-multi-switch.</p>
		</form-multi-switch>

		<script type="module">
			import { FormMultiSwitchElement } from 'https://esm.sh/@aarongustafson/form-multi-switch@0.0.1/form-multi-switch.js?bundle&target=es2022';

			if (!customElements.get('form-multi-switch')) {
				customElements.define('form-multi-switch', FormMultiSwitchElement);
			}
		</script>
	</body>
</html>
